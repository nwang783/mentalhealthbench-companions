# Fly.io config for the web demo. See "Web demo" in README.md.
app = "mhb-demo-nwang783"
primary_region = "iad"

[build]

[env]
  MAX_TASKS = "150"

[http_service]
  internal_port = 8080
  force_https = true
  # A run can take many minutes with no page open. If Fly stopped the machine
  # when idle, it would kill the run, so keep one machine on.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[mounts]
  source = "mhb_results"
  destination = "/app/results"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
